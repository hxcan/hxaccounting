name: Android CI

on:
  push:
    branches: [ master, release/** ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# Grant write permission for GITHUB_TOKEN (required to create releases)
permissions:
  contents: write

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run lint
      run: ./gradlew lint

    - name: Run unit tests
      run: ./gradlew test

    - name: Decode release keystore from secret
      id: decode-keystore
      if: ${{ env.HAS_KEYSTORE == 'true' }}
      run: |
        echo "${{ secrets.RELEASE_KEYSTORE_CONTENT_BASE64 }}" | base64 -d > app/release.keystore

    - name: Build debug APK
      run: ./gradlew assembleDebug

    - name: Build release APK
      if: ${{ env.HAS_KEYSTORE == 'true' }}
      env:
        KEYSTORE_FILE: app/release.keystore
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        ALIAS_PASSWORD: ${{ secrets.ALIAS_PASSWORD }}
      run: ./gradlew assembleRelease

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7

    - name: Upload release APK
      if: ${{ env.HAS_KEYSTORE == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 30

  release-debug-apk:
    name: Release Debug APK
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download debug APK
      uses: actions/download-artifact@v4
      with:
        name: app-debug
        path: apk/

    - name: Generate APK filename with timestamp
      id: apk-name
      run: |
        VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle || echo "0.1.0")
        VERSION_CODE=$(grep -oP 'versionCode\s+\K\d+' app/build.gradle || echo "1")
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        APK_NAME="hxaccounting-debug-v${VERSION_NAME}-${VERSION_CODE}-${TIMESTAMP}.apk"
        mv apk/app-debug.apk "apk/${APK_NAME}"
        echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
        echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
        echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
        echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT
        echo "apk_path=apk/${APK_NAME}" >> $GITHUB_OUTPUT
        ls -la apk/

    - name: Delete old release (if exists)
      uses: actions/github-script@v7
      with:
        script: |
          const targetTag = `ci/auto-build-${{ github.run_id }}`;
          try {
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            for (const release of releases.data) {
              if (release.tag_name === targetTag) {
                console.log(`Deleting existing release: ${release.tag_name}`);
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id
                });
              }
            }
          } catch (error) {
            console.log(`Note: ${error.message}`);
          }

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ci/auto-build-${{ github.run_id }}
        name: 🤖 CI Build
        prerelease: true
        body: |
          ## 🤖 自动构建版本

          **构建编号:** ${{ github.run_id }}
          **提交:** ${{ github.sha }}
          **时间:** ${{ github.event.head_commit.timestamp }}

          ---
          ### 📦 下载
          - **Debug 版**: `hxaccounting-debug-v*.apk` (自动签名，仅供测试)
            - 文件名格式：`hxaccounting-debug-v{versionName}-{versionCode}-{buildTime}.apk`

          ⚠️ Debug 版本使用共享 debug.keystore 签名，仅供测试。Release 版本需要主人本地配置正式密钥。

          ### 🔗 下载方式
          点击上方的文件即可下载，**无需登录**。


          ## What's Changed
          ${{ github.event.head_commit.message }}
        files: ${{ steps.apk-name.outputs.apk_path }}