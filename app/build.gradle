apply plugin: 'com.android.application'

android {
    namespace 'com.stupidbeauty.hxaccounting'
    compileSdk 34

    // Signing configuration: use shared debug.keystore (from sisterfuture project)
    // for debug builds. Release builds use the keystore file + credentials provided
    // via env vars (CI) or local keystore.properties (local builds).
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Release config: reads keystore path + passwords from env vars
        // (set by CI from GitHub Secrets), or falls back to a local
        // keystore.properties file when building locally.
        release {
            def keystorePropsFile = rootProject.file('keystore.properties')
            def keystoreProps = new Properties()
            if (keystorePropsFile.exists()) {
                keystoreProps.load(new FileInputStream(keystorePropsFile))
            }
            // Use absolute path from rootDir to avoid double app/app/ prefix
            // when build.gradle is inside app/ directory
            storeFile file(System.getenv('KEYSTORE_FILE') ?: keystoreProps.getProperty('storeFile', "${rootDir}/release.keystore"))
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: keystoreProps.getProperty('storePassword', '')
            // GitHub Secret name is KEYSTORE_ALIAS, not KEY_ALIAS
            keyAlias System.getenv('KEYSTORE_ALIAS') ?: keystoreProps.getProperty('keyAlias', '')
            keyPassword System.getenv('ALIAS_PASSWORD') ?: keystoreProps.getProperty('keyPassword', '')
        }
    }

    defaultConfig {
        applicationId "com.stupidbeauty.hxaccounting"
        minSdk 24
        targetSdk 34
        // v1.0.0 正式版：首次对外发布（给六日开始使用）
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Use release signing config (CI provides env vars; local builds use keystore.properties)
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // v2 修复：启用核心库 desugaring，让 java.time.* (LocalDate / ZoneId / Instant / ChronoUnit)
        // 能在 minSdk 24 (Android 7.0) 上运行，否则 lint 会报 NewApi。
        // Android 官方推荐方案：https://developer.android.com/studio/write/java8-support
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Room (SQLite ORM)
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Lifecycle / ViewModel
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'

    // Coroutines (for Java)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Crash monitoring - sisterfuture CrashDetector (task #859222728113)
    implementation 'com.github.hxcan:android-crash-detector:2026.4.8'

    // v2 修复：Java 8+ API desugaring 库（提供 java.time.* 等在低版本 Android 上的实现）
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}