apply plugin: 'com.android.application'

android {
    namespace 'com.stupidbeauty.hxaccounting'
    compileSdk 34

    // Signing configuration: use shared debug.keystore (from sisterfuture project)
    // for debug builds. Release builds will use 主人's private release.keystore.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Release config: 主人 creates keystore.properties locally with:
        //   storeFile=release.keystore
        //   storePassword=***
        //   keyAlias=***
        //   keyPassword=***
        // and loads it here. Not committed.
    }

    defaultConfig {
        applicationId "com.stupidbeauty.hxaccounting"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Release signing requires 主人's private release.keystore
            // (not committed; configured via local keystore.properties)
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // v2 修复：启用核心库 desugaring，让 java.time.* (LocalDate / ZoneId / Instant / ChronoUnit)
        // 能在 minSdk 24 (Android 7.0) 上运行，否则 lint 会报 NewApi。
        // Android 官方推荐方案：https://developer.android.com/studio/write/java8-support
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Room (SQLite ORM)
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Lifecycle / ViewModel
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'

    // Coroutines (for Java)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Crash monitoring - sisterfuture CrashDetector (task #859222728113)
    implementation 'com.github.hxcan:android-crash-detector:2026.4.8'

    // v2 修复：Java 8+ API desugaring 库（提供 java.time.* 等在低版本 Android 上的实现）
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
